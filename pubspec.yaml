version: 4.0.1
repository: https://github.com/easyhour/convex_bottom_bar
homepage: https://github.com/easyhour/convex_bottom_bar
issue_tracker: https://github.com/easyhour/convex_bottom_bar/issues
topics:
  - widgets
  - navigation
  - bottom-navigation-bar

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
